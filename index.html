<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020405">
<title>WINDOW — Somewhere Else</title>
<meta name="description" content="Open a source-verified public window somewhere else on Earth, right now.">
<link rel="stylesheet" href="styles.css?v=20260928-9">
</head>
<body>
<main>
  <div id="view"><div class="empty"><div class="orb"></div></div></div>
  <div class="shade"></div>
  <div class="grain"></div>

  <header>
    <a class="brand" href="./">WINDOW</a>
    <div class="top-right">
      <span id="status">VERIFYING VIEW…</span>
      <button id="toolsToggle" class="text-button" type="button" aria-expanded="false" aria-controls="tools">SEEK EARTH +</button>
    </div>
  </header>

  <section class="copy" aria-live="polite">
    <p class="eyebrow">A WINDOW OPENED IN</p>
    <h1 id="place">EARTH</h1>
    <p id="time"></p>
  </section>

  <section class="seeker" id="tools" aria-label="WINDOW instruments" hidden>
    <div class="tools-head"><span>SEEK EARTH</span><button id="toolsClose" class="text-button" type="button">CLOSE ×</button></div>
    <p class="tools-note">Name a place, use coordinates, or watch verified eyes along a route.</p>
    <form id="seekForm">
      <input id="seekInput" autocomplete="off" placeholder="TOKYO · ICELAND · 27.27, -80.36" aria-label="Location">
      <button>OPEN NEAREST EYE</button>
    </form>
    <form id="routeForm" class="route-form">
      <input id="routeFrom" autocomplete="off" placeholder="FROM" aria-label="Route origin">
      <input id="routeTo" autocomplete="off" placeholder="TO" aria-label="Route destination">
      <button>WATCH ROUTE</button>
    </form>
    <div id="seekMeta"></div>
  </section>

  <section id="routeTelescope" class="route-telescope" hidden aria-label="Live route telescope">
    <div class="route-head"><strong>LIVE CORRIDOR</strong><span id="routeMeta"></span></div>
    <div class="route-rail"><span class="route-now">NOW</span><div id="routeEyes" class="route-eyes"></div><span class="route-destination">DESTINATION</span></div>
  </section>

  <div class="bottom">
    <div class="truth">
      <span id="truthDot"></span>
      <div><strong id="truth">SOURCE-VERIFIED VIEWS ONLY</strong><a id="source" target="_blank" rel="noreferrer"></a></div>
    </div>
    <button id="next" class="jump"><small>OPEN ANOTHER WINDOW</small><span>SOMEWHERE ELSE&nbsp; →</span></button>
  </div>

  <footer>IF YOU CAN SEE IT, IT'S THERE.</footer>
</main>
<script>
(function(){
  var seeds=[[40.7128,-74.006],[35.6762,139.6503],[51.5074,-.1278],[37.7749,-122.4194]];
  var p=seeds[Math.floor(Math.random()*seeds.length)],u='/api/seek?lat='+p[0]+'&lng='+p[1]+'&boot=1';
  fetch(u,{cache:'no-store',headers:{accept:'application/json'}}).then(function(r){return r.ok?r.json():Promise.reject(r.status)}).then(function(j){
    var a=j&&j.cameras;if(!a||!a.length)return;
    var x=a[0],v=document.getElementById('view'),el;
    if(x.type==='video'){el=document.createElement('video');el.src=x.embed;el.autoplay=true;el.muted=true;el.playsInline=true;el.controls=true}
    else if(x.type==='image'){el=document.createElement('img');el.src=x.embed;el.alt=x.place||'Live Earth view'}
    else{el=document.createElement('iframe');el.src=x.embed;el.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';el.allowFullscreen=true}
    v.innerHTML='';v.appendChild(el);v.setAttribute('data-boot-eye','1');
    var pl=document.getElementById('place');if(pl&&x.place)pl.textContent=String(x.place).toUpperCase();
    var st=document.getElementById('status');if(st)st.textContent=(x.status||'VERIFIED')+' SOURCE';
    var tr=document.getElementById('truth');if(tr)tr.textContent=(x.status||'VERIFIED')+' SOURCE · '+String(x.provider||'PUBLIC').toUpperCase();
    var so=document.getElementById('source');if(so&&x.source){so.href=x.source;so.textContent='OPEN SOURCE ↗'}
  }).catch(function(e){var st=document.getElementById('status');if(st)st.textContent='DISCOVERY UNAVAILABLE'});
})();
</script><script src="cameras.js?v=20260928-9"></script><script src="adapters.js?v=20260928-9"></script><script src="route.js?v=20260928-9"></script><script src="routing.js?v=20260928-9"></script><script src="app.js?v=20260928-9"></script>
</body></html>
