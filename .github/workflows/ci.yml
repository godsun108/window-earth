name: WINDOW CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run WINDOW core smoke test
        run: node test-core.cjs
      - name: Verify discovery service contract
        run: node test-discovery.mjs
      - name: Enforce release fingerprint
        run: |
          grep -q 'app.js?v=20260929-1' index.html
          ! grep -q 'app.js?v=20260928-13' index.html
